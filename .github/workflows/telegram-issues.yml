name: Telegram - novas issues

on:
  issues:
    types:
      - opened
      - reopened
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-issue-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  notificar:
    name: Enviar aviso ao Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Validar configuração
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::error::O secret TELEGRAM_BOT_TOKEN não foi configurado."
            exit 1
          fi

          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::O secret TELEGRAM_CHAT_ID não foi configurado."
            exit 1
          fi

      - name: Enviar notificação
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            mensagem=$(printf '✅ Teste concluído\n\nAs notificações do TAPIMOVEL estão conectadas ao Telegram.\nRepositório: %s' "$REPOSITORY")
          else
            mensagem=$(printf '🐞 Issue aberta para correção\n\n#%s — %s\nAutor: %s\nRepositório: %s\n\n%s' \
              "$ISSUE_NUMBER" "$ISSUE_TITLE" "$ISSUE_AUTHOR" "$REPOSITORY" "$ISSUE_URL")
          fi

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 2 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 30 \
            --request POST \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$mensagem" \
            --data-urlencode "disable_web_page_preview=true" \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"
